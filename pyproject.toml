[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "kuricrypt"
dynamic = ["version"]
description = "Rust-based Telegram cryptography extension for Python"
requires-python = ">=3.10"
authors = [
    { name = "KurimuzonAkuma" },
]
readme = "README.md"
maintainers = [
    { name = "KurimuzonAkuma" },
    { name = "Danipulok", email = "danipulok@gmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet",
    "Topic :: Communications",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Source = "https://github.com/kurigram-org/kuricrypt"
Issues = "https://github.com/kurigram-org/kuricrypt/issues"
Community = "https://t.me/kurigram_chat"

[tool.maturin]
module-name = "kuricrypt"
bindings = "pyo3"
include = ["kuricrypt.pyi"]
